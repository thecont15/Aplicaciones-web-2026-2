name: CD - Daproyect - Migrar y sembrar Productos

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-daproyect-main
  cancel-in-progress: false

jobs:
  migrar-y-sembrar-productos:
    name: Crear tabla productos y cargar datos de Daproyect
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrar tabla productos y ejecutar seeder del integrante
        run: |
          PYTHONPATH=. python -m src.database.seeder_producto
