name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Verificar Pylint, Pytest y Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pylint
        run: |
          pylint src --fail-under=7.0 --disable=C0114,C0115,C0116,E0401,R0903

      - name: Ejecutar pruebas con Pytest
        env:
          DATABASE_URL: sqlite://
          PYTHONPATH: .
        run: |
          python -m pytest -v

      - name: Construir imagen Docker
        run: |
          docker build -t api-itm:${{ github.sha }} .

      - name: Ejecutar y verificar contenedor Docker
        run: |
          docker run -d --name test-api -p 8000:8000 -e DATABASE_URL="sqlite:///./test.db" api-itm:${{ github.sha }}
          sleep 3
          docker logs test-api
          docker stop test-api
